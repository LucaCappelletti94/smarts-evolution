name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Dioxus CLI
        run: |
          cargo install dioxus-cli --locked --version 0.7.6 --root "${{ runner.temp }}/dioxus-cli"

      - name: Verify Dioxus CLI
        run: |
          "${{ runner.temp }}/dioxus-cli/bin/dx" --version

      - name: Build production web app
        working-directory: apps/web
        run: |
          "${{ runner.temp }}/dioxus-cli/bin/dx" build --platform web --release --debug-symbols false

      - name: Prepare Pages artifact
        run: touch apps/web/target/dx/smarts-evolution-web/release/web/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/target/dx/smarts-evolution-web/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://smartsevo.earthmetabolome.org

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
